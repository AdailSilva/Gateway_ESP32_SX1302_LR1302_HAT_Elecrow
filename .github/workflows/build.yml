# Builds the firmware for the three supported boards (ESP32 modules):
#   esp32            ESP32-WROOM-32U DevKit
#   esp32s3_n16r8    ESP32-S3-WROOM-1U-N16R8 DevKit
#   esp32s3_n32r16v  ESP32-S3-WROOM-2-N32R16V DevKit
#
#   push / pull request -> binaries as workflow artifacts, version from "git describe"
#                          (e.g. 0.0.1-3-gabc1234)
#   tag vX.Y.Z          -> GitHub Release "vX.Y.Z" with the binaries of version X.Y.Z
#   tag vX.Y.Z-rc1      -> same, marked as pre-release
#
# The version written into the firmware (boot banner, web page, MQTT metadata,
# app descriptor) always comes from the tag: nothing to edit by hand.
name: build

env:
  PKG: Gateway_ESP32_SX1302_LR1302_HAT_Elecrow     # prefix of the binaries / release files (= repository name)
  APP: ESP32_SX1302-Pkt-Fwd                   # project() name in CMakeLists.txt -> build-<board>/$APP.bin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags and history for git describe

      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH (e.g. v0.0.1 or v0.1.0-rc1)"
              exit 1
            fi
            ver="${tag#v}"
            release=true
            case "$ver" in *-*) pre=true ;; *) pre=false ;; esac
          else
            ver=$(git describe --tags --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
            [ -n "$ver" ] || ver="0.0.0-dev+$(git rev-parse --short HEAD)"
            release=false
            pre=false
          fi
          echo "version=$ver"       >> "$GITHUB_OUTPUT"
          echo "release=$release"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre"    >> "$GITHUB_OUTPUT"
          echo "### Firmware version: \`$ver\`" >> "$GITHUB_STEP_SUMMARY"

  firmware:
    name: ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: esp32
            target: esp32
            name: ESP32-WROOM-32U_DevKit
          - board: esp32s3_n16r8
            target: esp32s3
            name: ESP32-S3-WROOM-1U-N16R8_DevKit
          - board: esp32s3_n32r16v
            target: esp32s3
            name: ESP32-S3-WROOM-2-N32R16V_DevKit
    env:
      FW_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          sh scripts/build.sh ${{ matrix.board }}

      - name: Package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          t=${{ matrix.target }}
          bd=${{ matrix.board }}
          b=build-$bd
          name="$PKG-$FW_VERSION-$bd"
          d=dist/$bd
          mkdir -p "$d"

          # 1) single image: write at 0x0 with any flasher (esptool, ESP Web Tools, Flash Download Tool)
          (cd "$b" && python -m esptool --chip "$t" merge_bin -o "../$d/$name-full.bin" @flash_args)

          # 2) application only: firmware update of a board that already runs the gateway (0x10000)
          cp "$b/$APP.bin" "$d/$name-app.bin"

          # 3) separate parts + offsets, for esptool write_flash @flash_args
          #    (same sub-folders as build-<board>/, so the paths inside flash_args work)
          p="$d/parts"
          mkdir -p "$p/bootloader" "$p/partition_table"
          cp "$b/bootloader/bootloader.bin" "$p/bootloader/"
          cp "$b/partition_table/partition-table.bin" "$p/partition_table/"
          [ -f "$b/ota_data_initial.bin" ] && cp "$b/ota_data_initial.bin" "$p/"
          cp "$b/$APP.bin" "$b/flash_args" "$b/flasher_args.json" "$p/"
          (cd "$p" && python -m zipfile -c "../$name-parts.zip" ./*) && rm -rf "$p"

          ls -l "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}-${{ needs.version.outputs.version }}-${{ matrix.board }}
          path: dist/${{ matrix.board }}/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..

          # notes = section "## vX.Y.Z" of doc/CHANGELOG.md (if present)
          awk -v v="## v$VERSION" '
            index($0, v) == 1 { on = 1; next }
            on && /^(## |---)/ { exit }
            on { print }' doc/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Firmware v$VERSION" > notes.md
          cat >> notes.md <<EOF

          ### Arquivos
          | Placa | \`BOARD\` | Imagem única (gravar em 0x0) | Só a aplicação (0x10000) |
          |---|---|---|---|
          | ESP32-WROOM-32U DevKit | \`esp32\` | \`$PKG-$VERSION-esp32-full.bin\` | \`$PKG-$VERSION-esp32-app.bin\` |
          | ESP32-S3-WROOM-1U-N16R8 DevKit | \`esp32s3_n16r8\` | \`$PKG-$VERSION-esp32s3_n16r8-full.bin\` | \`$PKG-$VERSION-esp32s3_n16r8-app.bin\` |
          | ESP32-S3-WROOM-2-N32R16V DevKit | \`esp32s3_n32r16v\` | \`$PKG-$VERSION-esp32s3_n32r16v-full.bin\` | \`$PKG-$VERSION-esp32s3_n32r16v-app.bin\` |

          \`$PKG-$VERSION-<placa>-parts.zip\`: bootloader, tabela de partições e aplicação separados, com os offsets em \`flash_args\` (\`esptool.py write_flash @flash_args\`).

          > Os dois S3 **não** são intercambiáveis: o N16R8 tem flash quad de 3,3 V e o N32R16V flash octal de 1,8 V. A imagem da placa errada não inicia. Confira o código na blindagem do módulo.

          A imagem única preenche a área da NVS com 0xFF: o gateway volta aos valores de fábrica (configuração e certificados MQTT). Para manter a configuração, grave só a aplicação em 0x10000.

          \`\`\`bash
          # imagem única (apaga a configuração)
          esptool.py --chip esp32   -p /dev/ttyUSB0 write_flash 0x0 $PKG-$VERSION-esp32-full.bin
          esptool.py --chip esp32s3 -p /dev/ttyACM0 write_flash 0x0 $PKG-$VERSION-esp32s3_n16r8-full.bin
          esptool.py --chip esp32s3 -p /dev/ttyACM0 write_flash 0x0 $PKG-$VERSION-esp32s3_n32r16v-full.bin

          # só a aplicação (mantém a configuração)
          esptool.py --chip esp32   -p /dev/ttyUSB0 write_flash 0x10000 $PKG-$VERSION-esp32-app.bin
          esptool.py --chip esp32s3 -p /dev/ttyACM0 write_flash 0x10000 $PKG-$VERSION-esp32s3_n16r8-app.bin
          esptool.py --chip esp32s3 -p /dev/ttyACM0 write_flash 0x10000 $PKG-$VERSION-esp32s3_n32r16v-app.bin
          \`\`\`
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: dist/*
